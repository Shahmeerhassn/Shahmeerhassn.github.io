<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sheikh Shahmeer Hassan — Portfolio</title></head><body><div style="font-family:Arial,sans-serif;padding:32px">Loading portfolio…</div><script>(async()=>{const urls=[`portfolio-payload.txt?v=${Date.now()}`,`https://raw.githubusercontent.com/Shahmeerhassn/Shahmeerhassn.github.io/main/portfolio-payload.txt?v=${Date.now()}`];let last='';for(let attempt=0;attempt<3;attempt++){for(const u of urls){try{const r=await fetch(u,{cache:'no-store'});if(!r.ok){last=`HTTP ${r.status}`;continue}const s=(await r.text()).replace(/\s/g,'');const bytes=Uint8Array.from(atob(s),c=>c.charCodeAt(0));if(!('DecompressionStream' in window))throw new Error('Browser does not support gzip decompression');const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();if(!html.includes('<!doctype')&&!html.includes('<html'))throw new Error('Invalid portfolio payload');document.open();document.write(html);document.close();return}catch(e){last=e&&e.message?e.message:String(e)}}await new Promise(r=>setTimeout(r,800))}document.body.innerHTML='<div style="font-family:Arial,sans-serif;padding:40px"><h2>Portfolio failed to load.</h2><p>Please hard-refresh the page (Ctrl+F5).</p><small>'+last+'</small></div>'})()</script></body></html>
