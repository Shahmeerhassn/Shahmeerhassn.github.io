<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sheikh Shahmeer Hassan</title></head><body><script>(async()=>{try{const s=await fetch("portfolio-payload.txt?x="+Date.now()).then(r=>r.text()),b=Uint8Array.from(atob(s.replace(/\s/g,"")),c=>c.charCodeAt(0)),h=await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream("gzip"))).text();document.open();document.write(h);document.close()}catch(e){document.body.innerHTML="<pre>Portfolio failed to load. Please refresh.</pre>"}})()</script></body></html>
