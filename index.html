<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sheikh Shahmeer Hassan</title></head><body><script>(async()=>{try{const urls=["portfolio-payload.txt","https://raw.githubusercontent.com/Shahmeerhassn/Shahmeerhassn.github.io/main/portfolio-payload.txt"];let r=null;for(const u of urls){try{const x=await fetch(u+"?v=2",{cache:"no-store"});if(x.ok){r=x;break}}catch(e){}}if(!r)throw new Error("Portfolio payload unavailable");const s=(await r.text()).replace(/\s/g,"");const b=Uint8Array.from(atob(s),c=>c.charCodeAt(0));const h=await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream("gzip"))).text();document.open();document.write(h);document.close()}catch(e){document.body.innerHTML="<div style=\"font-family:Arial,sans-serif;padding:40px\"><h2>Portfolio is temporarily unavailable.</h2><p>Please refresh in a few seconds.</p></div>";console.error(e)}})()</script></body></html>
